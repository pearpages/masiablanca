name: Desplega a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un desplegament a la vegada; no cancel·lis el que ja s'està publicant.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro's sharp output is deterministic, so the derivatives survive
      # between runs and only changed images get re-encoded.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/data/species.generated.json') }}
          restore-keys: astro-assets-

      # El catàleg d'espècies i les imatges ja són al repositori: la
      # compilació no truca mai a la Viquipèdia ni a Commons.
      - run: pnpm build

      - run: node scripts/check-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
